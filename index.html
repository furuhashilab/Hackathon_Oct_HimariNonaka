<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- タイトルは Maplat が apps/fuchinobe.json の appName で上書きします -->
  <title>淵野辺 今昔マップ</title>

  <!-- OpenLayers（Maplat が内部で使う地図ライブラリ） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.11.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@10.11.0/dist/ol.js"></script>

  <!-- Maplat UI（古地図ビューア本体） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@maplat/ui@1.1.0/dist/maplat_ui.css">
  <script src="https://cdn.jsdelivr.net/npm/@maplat/ui@1.1.0/dist/maplat_ui.umd.js"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    /* Maplat はこの div の中に地図を描きます。画面いっぱいに広げます */
    #map_div {
      position: absolute;
      inset: 0;
    }
  </style>
</head>
<body>
  <div id="map_div"></div>

  <script>
    // apps/fuchinobe.json の設定を読み込んで地図を表示します
    MaplatUi.createObject({ appid: "fuchinobe" }).then(function () {
      console.log("Maplat の準備ができました");
    });
  </script>
</body>
</html>
